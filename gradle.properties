# Gradle
org.gradle.jvmargs=-Xmx2048m

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# Android
android.useAndroidX=true

# Enable LeakCanary
leakcanary.enable=false

# Trixarr Beta 1.1; existing semantic versionCode convention yields 10102.
jellyfin.version=0.1.1-beta.2
