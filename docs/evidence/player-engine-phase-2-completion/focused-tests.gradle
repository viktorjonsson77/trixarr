// Keep Kotest discovery limited before Gradle applies descriptor filtering.
gradle.projectsEvaluated {
    def appProject = rootProject.findProject(':app')
    if (appProject != null) {
        appProject.tasks.withType(Test).configureEach {
            systemProperty 'kotest.filter.specs', 'org.jellyfin.androidtv.ui.playback.*'
            include '**/ui/playback/**/*Tests.class'
        }
    }
}
